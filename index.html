    ];

    function renderTable(filterCat = "all") {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        const filtered = menuData.filter(item => filterCat === "all" || item.category === filterCat);
        if(filtered.length === 0) {
            const row = tbody.insertRow();
            row.insertCell(0).colSpan = 4;
            row.cells[0].textContent = "😋 Блюда в этой категории скоро появятся!";
            row.cells[0].style.textAlign = "center";
            row.cells[0].style.padding = "2rem";
            return;
        }
        filtered.forEach(item => {
            const row = tbody.insertRow();
            // Название + категория
            const titleCell = row.insertCell(0);
            titleCell.innerHTML = `<div class="item-title">🍗 ${item.name}</div><span class="category-badge">${item.category}</span>`;
            // Состав
            const ingCell = row.insertCell(1);
            let ingText = item.ingredients;
            if(item.weight && !ingText.includes("Вес")) ingText += ` · Вес: ${item.weight}`;
            ingCell.innerHTML = `<div class="ingredients">${ingText}</div>${item.ingredients.includes("кости") ? '<div class="warning">⚠️ может содержать фрагменты костей</div>' : ''}`;
            // цена
            const priceCell = row.insertCell(2);
            priceCell.innerHTML = `<div class="price">${item.price}</div>`;
            // КБЖУ
            const nutritionCell = row.insertCell(3);
            let nutrHtml = "";
            if(item.kcal !== "—") nutrHtml += `🔥 ${item.kcal} · `;
            if(item.proteins !== "—") nutrHtml += `⚡️ Б ${item.proteins} · `;
            if(item.fats !== "—") nutrHtml += `Ж ${item.fats} · `;
            if(item.carbs !== "—") nutrHtml += `У ${item.carbs}`;
            if(!nutrHtml) nutrHtml = "Информация уточняется";
            if(item.weight && !item.ingredients.includes(item.weight)) nutrHtml += `<div style="margin-top:4px;">⚖️ ${item.weight}</div>`;
            nutritionCell.innerHTML = `<div class="nutrition">${nutrHtml}</div>`;
        });
    }

    // фильтр активные кнопки
    const btns = document.querySelectorAll(".filter-btn");
    btns.forEach(btn => {
        btn.addEventListener("click", () => {
            btns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const cat = btn.getAttribute("data-cat");
            renderTable(cat);
        });
    });
    
    // начальная отрисовка
    renderTable("all");
</script>
</body>
</html>
